<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heures">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Suivi Heures">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E4D3A">
<title>Heures — Coach</title>
<style>
  :root{
    --court:#1E4D3A;
    --court-dark:#123527;
    --clay:#C1652F;
    --clay-light:#E8A264;
    --line:#F4F1E8;
    --ink:#0F2A20;
    --muted:#6B8577;
    --card:#FFFFFF;
    --danger:#B4402A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--court);
    background-image:
      linear-gradient(var(--court-dark) 1px, transparent 1px),
      linear-gradient(90deg, var(--court-dark) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%;
    color:var(--ink);
    min-height:100vh;
    padding:0 0 40px 0;
  }
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px;}

  .header{color:var(--line);text-align:center;padding:14px 0 20px;}
  .header .eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    opacity:.7;font-weight:600;
  }
  .header h1{margin:6px 0 0;font-size:22px;font-weight:700;}

  .scorecard{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    margin-bottom:16px;
  }
  .score-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .score-main{font-size:40px;font-weight:800;color:var(--court);line-height:1;}
  .score-main span{font-size:16px;font-weight:600;color:var(--muted);}
  .score-sub{text-align:right;}
  .score-sub .n{font-size:18px;font-weight:700;color:var(--clay);}
  .score-sub .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

  .track{
    margin-top:14px;height:10px;border-radius:6px;background:#E7EFE9;
    overflow:hidden;position:relative;
  }
  .track .fill{
    height:100%;background:linear-gradient(90deg,var(--clay-light),var(--clay));
    border-radius:6px;transition:width .4s ease;
  }
  .track .marks{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 1px;}
  .track .marks i{width:1px;background:rgba(255,255,255,.6);}

  .breakdown{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .chip{
    flex:1 1 auto;min-width:0;background:#F3F6F3;border-radius:10px;padding:8px 10px;
  }
  .chip .n{font-size:15px;font-weight:700;color:var(--court);}
  .chip .l{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .card{
    background:var(--card);border-radius:var(--radius);padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);margin-bottom:16px;
  }
  .card h2{margin:0 0 14px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}

  .reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .reasons .reason-btn:last-child:nth-child(odd){grid-column:1 / -1;}
  .reason-btn{
    border:2px solid #E3E9E4;background:#FAFBFA;border-radius:10px;
    padding:12px 8px;font-size:13px;font-weight:600;color:var(--ink);
    cursor:pointer;text-align:center;line-height:1.25;transition:.15s;
  }
  .reason-btn:active{transform:scale(.97);}
  .reason-btn.active{
    border-color:var(--clay);background:var(--clay);color:#fff;
  }

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input, .field textarea{
    width:100%;border:2px solid #E3E9E4;border-radius:10px;padding:12px;
    font-size:16px;font-family:inherit;color:var(--ink);background:#FAFBFA;
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--clay);}
  .checkbox-label{
    display:flex;align-items:center;gap:8px;margin-top:8px;
    font-size:12.5px;font-weight:600;color:var(--muted);text-transform:none;
    letter-spacing:normal;cursor:pointer;
  }
  .checkbox-label input{width:auto;padding:0;accent-color:var(--clay);}
  #heuresPerDayLabel{text-transform:none;font-weight:600;letter-spacing:normal;color:var(--clay);}
  .stepper{display:flex;align-items:stretch;gap:8px;}
  .stepper button{
    width:46px;border:2px solid #E3E9E4;background:#FAFBFA;border-radius:10px;
    font-size:20px;font-weight:700;color:var(--court);cursor:pointer;
  }
  .stepper button:active{background:#EFF3F0;}
  .stepper input{text-align:center;font-weight:700;}

  .field.hidden{display:none;}
  span.hidden{display:none;}

  .submit-btn{
    width:100%;padding:15px;border:none;border-radius:10px;
    background:var(--court);color:#fff;font-size:16px;font-weight:700;
    cursor:pointer;letter-spacing:.02em;
  }
  .submit-btn:active{background:var(--court-dark);}
  .submit-btn:disabled{background:#BFC9C2;cursor:not-allowed;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--court-dark);color:#fff;padding:10px 18px;border-radius:30px;
    font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;
    box-shadow:0 6px 20px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .entry{
    display:flex;align-items:center;gap:10px;padding:11px 0;
    border-bottom:1px solid #EEF1EE;
  }
  .entry:last-child{border-bottom:none;}
  .entry .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .entry .body{flex:1;min-width:0;}
  .entry .r{font-size:13.5px;font-weight:600;color:var(--ink);}
  .entry .d{font-size:11.5px;color:var(--muted);}
  .entry .h{font-size:14px;font-weight:700;color:var(--court);white-space:nowrap;}
  .entry .del{
    background:none;border:none;color:#C7CFC9;font-size:18px;cursor:pointer;
    padding:4px 6px;line-height:1;
  }
  .entry .del:active{color:var(--danger);}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 0;}
  .month-head{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 0 6px;
  }
  .month-head:first-child{padding-top:0;}
  .month-head .m{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--court);}
  .month-head .t{font-size:12px;font-weight:700;color:var(--clay);}
  .legend{font-size:11px;color:rgba(244,241,232,.7);text-align:center;margin-top:6px;}
 
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .toolbar select,.secondary-btn,.danger-btn{border:2px solid #E3E9E4;background:#FAFBFA;border-radius:10px;padding:10px;font:inherit;color:var(--ink);cursor:pointer;}
  .secondary-btn{font-size:12px;font-weight:700;}
  .toolbar .secondary-btn{width:100%;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat{background:#F3F6F3;border-radius:10px;padding:12px;}
  .stat .n{font-size:18px;font-weight:800;color:var(--court);}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
  .monthly-stats{margin-top:14px;}
  .month-stat{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #EEF1EE;font-size:12px;}
  .month-stat .bar{flex:1;margin:0 10px;height:7px;background:#E7EFE9;border-radius:5px;overflow:hidden;}
  .month-stat .bar i{display:block;height:100%;background:var(--clay);border-radius:5px;}
  .backup-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .file-btn{text-align:center;display:block;}
  .file-btn input{display:none;}
  .danger-zone{margin-top:10px;text-align:right;}
  .danger-btn{color:var(--danger);border-color:#F0D9D3;font-size:12px;font-weight:700;}
  .entry-actions{display:flex;gap:3px;}
  .entry .edit{background:none;border:none;color:#A8B5AD;font-size:16px;cursor:pointer;padding:4px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;}
  .modal.hidden{display:none;}
  .modal-card{width:min(480px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-card h2{margin:0 0 16px;font-size:16px;color:var(--court);}
  .modal-card select{width:100%;border:2px solid #E3E9E4;border-radius:10px;padding:12px;font:inherit;background:#FAFBFA;}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  @media print{
    body{background:#fff!important;color:#111;padding:0;}
    .header{color:#111;}
    .card{box-shadow:none;border:1px solid #ddd;}
    .card:nth-of-type(1), .card:nth-of-type(3){display:none;}
    .toolbar,.entry-actions,.del,.edit,.legend,.toast{display:none!important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="eyebrow">Suivi annuel</div>
    <h1>Mes heures de coaching</h1>
  </div>

  <div class="scorecard">
    <div class="score-row">
      <div class="score-main" id="totalHeures">0<span> / 1582 h</span></div>
      <div class="score-sub">
        <div class="n" id="pctDone">0%</div>
        <div class="l">réalisé</div>
      </div>
    </div>
    <div class="track"><div class="fill" id="fillBar" style="width:0%"></div></div>
    <div class="breakdown" id="breakdown"></div>
  </div>

  <div class="card">
    <h2>Nouvelle entrée</h2>

    <div class="field">
      <label>Raison</label>
      <div class="reasons" id="reasonButtons"></div>
    </div>

    <div class="field">
      <label>Date</label>
      <input type="date" id="dateInput">
      <label class="checkbox-label"><input type="checkbox" id="multiDayToggle"> Plusieurs jours (ex : stage lun→ven)</label>
    </div>

    <div class="field hidden" id="dateEndField">
      <label>Jusqu'au</label>
      <input type="date" id="dateEndInput">
      <label class="checkbox-label"><input type="checkbox" id="weekdaysOnly" checked> Jours ouvrés uniquement (lun-ven)</label>
    </div>

    <div class="field">
      <label>Heures <span id="heuresPerDayLabel" class="hidden">par jour</span></label>
      <div class="stepper">
        <button type="button" id="minusBtn">–</button>
        <input type="number" id="heuresInput" step="0.25" min="0" max="24" value="1">
        <button type="button" id="plusBtn">+</button>
      </div>
    </div>

    <div class="field hidden" id="kmField">
      <label>Kilomètres (trajet)</label>
      <input type="number" id="kmInput" step="1" min="0" placeholder="ex : 42">
    </div>

    <div class="field">
      <label>Note (facultatif)</label>
      <input type="text" id="noteInput" placeholder="ex : cours collectif U12">
    </div>

    <button class="submit-btn" id="submitBtn" disabled>Enregistrer</button>
  </div>

  <div class="card">
    <h2>Historique complet <span id="entryCount"></span></h2>
    <div id="entriesList"><div class="empty">Chargement…</div></div>
  </div>

  <div class="legend">Enregistré automatiquement sur cet appareil · Application installable</div>
</div>

<div class="toast" id="toast"></div>

<div class="modal hidden" id="editModal">
  <div class="modal-card">
    <h2>Modifier l'entrée</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>Raison</label><select id="editReason"></select></div>
    <div class="field"><label>Date</label><input type="date" id="editDate"></div>
    <div class="field"><label>Heures</label><input type="number" id="editHours" min="0.25" max="24" step="0.25"></div>
    <div class="field"><label>Kilomètres</label><input type="number" id="editKm" min="0" step="1"></div>
    <div class="field"><label>Note</label><input type="text" id="editNote"></div>
    <div class="modal-actions">
      <button type="button" class="secondary-btn" id="cancelEditBtn">Annuler</button>
      <button type="button" class="submit-btn" id="saveEditBtn">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const REASONS = [
  { key: "Journée de travail classique", label: "Journée classique", color: "#1E4D3A" },
  { key: "Stage", label: "Stage", color: "#C1652F" },
  { key: "Suivi joueur compétition", label: "Suivi compétition", color: "#2E6F49" },
  { key: "Trajet professionnel", label: "Trajet pro", color: "#8A5A2B" },
  { key: "Cours individuel", label: "Cours individuel", color: "#5B4B8A" },
];
let OBJECTIF = Number(localStorage.getItem("objectif_annuel")) || 1582;
const STORAGE_KEY = "entries";

let entries = [];
let selectedReason = null;

const $ = (id) => document.getElementById(id);

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function fmtDate(iso){
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

function renderReasonButtons(){
  const wrap = $("reasonButtons");
  wrap.innerHTML = "";
  REASONS.forEach(r=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "reason-btn";
    btn.textContent = r.label;
    btn.dataset.key = r.key;
    btn.addEventListener("click", ()=>{
      selectedReason = r.key;
      document.querySelectorAll(".reason-btn").forEach(b=>{
        b.classList.toggle("active", b.dataset.key === r.key);
      });
      $("kmField").classList.toggle("hidden", r.key !== "Trajet professionnel");
      updateSubmitState();
    });
    wrap.appendChild(btn);
  });
}

function isMultiDay(){
  return $("multiDayToggle").checked;
}

function dateRange(startISO, endISO, weekdaysOnly){
  const out = [];
  let d = new Date(startISO + "T00:00:00");
  const end = new Date(endISO + "T00:00:00");
  while(d <= end){
    const day = d.getDay(); // 0=dim, 6=sam
    if(!weekdaysOnly || (day !== 0 && day !== 6)){
      out.push(d.toISOString().slice(0,10));
    }
    d.setDate(d.getDate()+1);
  }
  return out;
}

function updateSubmitState(){
  const heures = parseFloat($("heuresInput").value);
  let ok = selectedReason && heures > 0;
  if(isMultiDay()){
    const start = $("dateInput").value, end = $("dateEndInput").value;
    ok = ok && !!start && !!end && end >= start;
  }
  $("submitBtn").disabled = !ok;
}

function computeTotals(){
  const totals = {};
  REASONS.forEach(r => totals[r.key] = 0);
  let total = 0;
  entries.forEach(e=>{
    totals[e.raison] = (totals[e.raison]||0) + e.heures;
    total += e.heures;
  });
  return { total, totals };
}

function renderDashboard(){
  const { total, totals } = computeTotals();
  $("totalHeures").innerHTML = `${round2(total)}<span> / ${OBJECTIF} h</span>`;
  const pct = Math.min(100, (total/OBJECTIF)*100);
  $("pctDone").textContent = `${pct.toFixed(1)}%`;
  $("fillBar").style.width = `${pct}%`;

  const bd = $("breakdown");
  bd.innerHTML = "";
  REASONS.forEach(r=>{
    const div = document.createElement("div");
    div.className = "chip";
    div.innerHTML = `<div class="n">${round2(totals[r.key])} h</div><div class="l">${r.label}</div>`;
    bd.appendChild(div);
  });
}

function round2(n){
  return Math.round(n*100)/100;
}

const MONTH_NAMES = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

function renderEntries(){
  const list = $("entriesList");
  const year = $("yearFilter")?.value || "all";
  const reason = $("reasonFilter")?.value || "all";
  const filtered = entries.filter(e => {
    const okYear = year === "all" || e.date.startsWith(year);
    const okReason = reason === "all" || e.raison === reason;
    return okYear && okReason;
  });
  $("entryCount").textContent = filtered.length ? `(${filtered.length})` : "";
  if(!filtered.length){
    list.innerHTML = `<div class="empty">Aucune entrée pour le moment</div>`;
    return;
  }
  const sorted = [...filtered].sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));

  // group by year-month
  const groups = [];
  let currentKey = null, currentGroup = null;
  sorted.forEach(e=>{
    const key = e.date.slice(0,7); // YYYY-MM
    if(key !== currentKey){
      currentKey = key;
      currentGroup = { key, items: [] };
      groups.push(currentGroup);
    }
    currentGroup.items.push(e);
  });

  list.innerHTML = "";
  groups.forEach(g=>{
    const [y,m] = g.key.split("-");
    const monthTotal = g.items.reduce((s,e)=>s+e.heures,0);
    const head = document.createElement("div");
    head.className = "month-head";
    head.innerHTML = `<div class="m">${MONTH_NAMES[parseInt(m,10)-1]} ${y}</div><div class="t">${round2(monthTotal)} h</div>`;
    list.appendChild(head);

    g.items.forEach(e=>{
      const reasonMeta = REASONS.find(r=>r.key===e.raison) || REASONS[0];
      const row = document.createElement("div");
      row.className = "entry";
      row.innerHTML = `
        <div class="dot" style="background:${reasonMeta.color}"></div>
        <div class="body">
          <div class="r">${e.raison}${e.km ? ` · ${e.km} km` : ""}</div>
          <div class="d">${fmtDate(e.date)}${e.note ? " · " + escapeHtml(e.note) : ""}</div>
        </div>
        <div class="h">${round2(e.heures)} h</div>
        <div class="entry-actions">
          <button class="edit" data-id="${e.id}" aria-label="Modifier">✎</button>
          <button class="del" data-id="${e.id}" aria-label="Supprimer">✕</button>
        </div>
      `;
      list.appendChild(row);
    });
  });

  list.querySelectorAll(".del").forEach(btn=>{
    btn.addEventListener("click", ()=> deleteEntry(btn.dataset.id));
  });
  list.querySelectorAll(".edit").forEach(btn=>{
    btn.addEventListener("click", ()=> openEdit(btn.dataset.id));
  });
}

function escapeHtml(s){
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

async function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(err){
    entries = [];
  }
  refreshAll();
}

async function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(err){
    toast("Erreur d'enregistrement — réessaie");
  }
}

function makeId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

async function addEntry(){
  const heures = parseFloat($("heuresInput").value);
  if(!selectedReason || !(heures > 0)) return;

  const km = selectedReason === "Trajet professionnel" ? (parseFloat($("kmInput").value) || 0) : 0;
  const note = $("noteInput").value.trim();

  let dates;
  if(isMultiDay()){
    const start = $("dateInput").value, end = $("dateEndInput").value;
    if(!start || !end || end < start) return;
    dates = dateRange(start, end, $("weekdaysOnly").checked);
    if(!dates.length) return;
  }else{
    dates = [$("dateInput").value || todayISO()];
  }

  dates.forEach(date=>{
    entries.push({ id: makeId(), date, raison: selectedReason, heures, km, note });
  });

  await saveEntries();

  toast(dates.length > 1 ? `${dates.length} entrées enregistrées` : "Entrée enregistrée");

  // reset form (keep reason selection and dates for fast repeat entry)
  $("noteInput").value = "";
  $("kmInput").value = "";
  $("heuresInput").value = "1";
  updateSubmitState();
}

async function deleteEntry(id){
  entries = entries.filter(e=>e.id !== id);
  await saveEntries();
  refreshAll();
  toast("Entrée supprimée");
}

function initMultiDay(){
  $("multiDayToggle").addEventListener("change", ()=>{
    const on = isMultiDay();
    $("dateEndField").classList.toggle("hidden", !on);
    $("heuresPerDayLabel").classList.toggle("hidden", !on);
    if(on && !$("dateEndInput").value) $("dateEndInput").value = $("dateInput").value;
    updateSubmitState();
  });
  $("dateEndInput").addEventListener("change", updateSubmitState);
  $("dateInput").addEventListener("change", updateSubmitState);
}

function initStepper(){
  $("minusBtn").addEventListener("click", ()=>{
    const el = $("heuresInput");
    el.value = Math.max(0, (parseFloat(el.value)||0) - 0.5);
    updateSubmitState();
  });
  $("plusBtn").addEventListener("click", ()=>{
    const el = $("heuresInput");
    el.value = (parseFloat(el.value)||0) + 0.5;
    updateSubmitState();
  });
  $("heuresInput").addEventListener("input", updateSubmitState);
}

function populateFilters(){
  const years = [...new Set(entries.map(e=>e.date.slice(0,4)))].sort().reverse();
  const yf = $("yearFilter"), rf = $("reasonFilter");
  if(yf){
    const current = yf.value || "all";
    yf.innerHTML = `<option value="all">Toutes les années</option>` +
      years.map(y=>`<option value="${y}">${y}</option>`).join("");
    yf.value = years.includes(current) ? current : "all";
    yf.onchange = renderEntries;
  }
  if(rf){
    const current = rf.value || "all";
    rf.innerHTML = `<option value="all">Toutes les raisons</option>` +
      REASONS.map(r=>`<option value="${escapeHtml(r.key)}">${escapeHtml(r.label)}</option>`).join("");
    rf.value = REASONS.some(r=>r.key===current) ? current : "all";
    rf.onchange = renderEntries;
  }
}

function renderStats(){
  if(!$("statMonth")) return; // stats toolbar not present in this build
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const monthTotal = entries.filter(e=>e.date.startsWith(ym)).reduce((s,e)=>s+e.heures,0);
  const days = new Set(entries.map(e=>e.date)).size;
  const total = computeTotals().total;
  $("statMonth").textContent = `${round2(monthTotal)} h`;
  $("statDays").textContent = days;
  $("statAvg").textContent = `${round2(days ? total/days : 0)} h`;
  $("statRemaining").textContent = `${round2(Math.max(0, OBJECTIF-total))} h`;

  const monthly = {};
  entries.forEach(e=>{
    const key=e.date.slice(0,7);
    monthly[key]=(monthly[key]||0)+e.heures;
  });
  const max = Math.max(1,...Object.values(monthly));
  $("monthlyStats").innerHTML = Object.entries(monthly).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>{
    const [y,m]=k.split("-");
    return `<div class="month-stat"><b>${MONTH_NAMES[+m-1]} ${y}</b><div class="bar"><i style="width:${(v/max)*100}%"></i></div><strong>${round2(v)} h</strong></div>`;
  }).join("") || `<div class="empty">Pas encore de statistiques</div>`;
}

function refreshAll(){
  renderDashboard();
  populateFilters();
  renderEntries();
  renderStats();
}

function openEdit(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  $("editId").value=e.id;
  $("editReason").innerHTML=REASONS.map(r=>`<option value="${escapeHtml(r.key)}">${escapeHtml(r.label)}</option>`).join("");
  $("editReason").value=e.raison;
  $("editDate").value=e.date;
  $("editHours").value=e.heures;
  $("editKm").value=e.km || "";
  $("editNote").value=e.note || "";
  $("editKm").parentElement.classList.toggle("hidden", e.raison!=="Trajet professionnel");
  $("editReason").onchange=()=>$("editKm").parentElement.classList.toggle("hidden",$("editReason").value!=="Trajet professionnel");
  $("editModal").classList.remove("hidden");
}

function closeEdit(){ $("editModal").classList.add("hidden"); }

async function saveEdit(){
  const id=$("editId").value;
  const e=entries.find(x=>x.id===id);
  if(!e) return;
  const hours=parseFloat($("editHours").value);
  if(!(hours>0)) return;
  e.raison=$("editReason").value;
  e.date=$("editDate").value || todayISO();
  e.heures=hours;
  e.km=e.raison==="Trajet professionnel" ? (parseFloat($("editKm").value)||0) : 0;
  e.note=$("editNote").value.trim();
  await saveEntries();
  closeEdit();
  refreshAll();
  toast("Entrée modifiée");
}

function exportCSV(){
  const rows=[["Date","Raison","Heures","Kilomètres","Note"],...entries.map(e=>[e.date,e.raison,e.heures,e.km||0,e.note||""])];
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`suivi-heures-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(a.href);
}

function backup(){
  const data={version:2, objectif:OBJECTIF, entries};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`sauvegarde-heures-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(a.href);
}

function restore(file){
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const data=JSON.parse(reader.result);
      const restored=Array.isArray(data)?data:data.entries;
      if(!Array.isArray(restored)) throw new Error();
      entries=restored;
      if(data.objectif) OBJECTIF=Number(data.objectif)||1582;
      localStorage.setItem("objectif_annuel",OBJECTIF);
      await saveEntries(); refreshAll(); toast("Sauvegarde restaurée");
    }catch(e){toast("Sauvegarde invalide");}
  };
  reader.readAsText(file);
}

function updateTarget(){
  const n=Number($("targetInput")?.value);
  if(n>0){ OBJECTIF=n; localStorage.setItem("objectif_annuel",String(n)); refreshAll(); toast("Objectif mis à jour"); }
}

function init(){
  $("dateInput").value = todayISO();
  renderReasonButtons();
  initStepper();
  initMultiDay();
  $("submitBtn").addEventListener("click", async()=>{await addEntry(); refreshAll();});

  // Optional toolbar elements — only wired up if present in the page,
  // so a missing button never blocks the app from loading saved entries.
  if($("targetInput")){
    $("targetInput").value = OBJECTIF;
    $("targetInput").addEventListener("change", updateTarget);
  }
  $("exportCsvBtn")?.addEventListener("click", exportCSV);
  $("printBtn")?.addEventListener("click", ()=>window.print());
  $("backupBtn")?.addEventListener("click", backup);
  $("restoreInput")?.addEventListener("change", e=>{if(e.target.files[0]) restore(e.target.files[0]);});
  $("clearBtn")?.addEventListener("click", async()=>{
    if(confirm("Supprimer toutes les entrées ? Cette action est irréversible.")){
      entries=[]; await saveEntries(); refreshAll(); toast("Données effacées");
    }
  });
  $("cancelEditBtn").addEventListener("click", closeEdit);
  $("saveEditBtn").addEventListener("click", saveEdit);
  $("editModal").addEventListener("click", e=>{if(e.target.id==="editModal") closeEdit();});
  loadEntries();
}

init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
